<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません / ミレストのメメントモリ分析データ室</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" href="/assets/miresto/miresto-icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/miresto/miresto-icon-180.png">
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #647086;
      --line: #d9dfeb;
      --paper: #fbfaf7;
      --navy: #0b2a57;
      --gold: #b88932;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: linear-gradient(180deg, #fbfaf7 0%, #f5efe3 100%);
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Sans", "Meiryo", system-ui, sans-serif;
    }

    .box {
      display: grid;
      justify-items: center;
      gap: 14px;
      max-width: 460px;
      text-align: center;
    }

    .eyebrow {
      margin: 0;
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 36px);
      line-height: 1.3;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    img {
      width: clamp(160px, 44vw, 220px);
      height: auto;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin-top: 6px;
      padding: 10px 20px;
      border: 1px solid var(--navy);
      border-radius: 8px;
      background: var(--navy);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="box">
    <p class="eyebrow">404 NOT FOUND</p>
    <picture>
      <source type="image/webp" srcset="/assets/miresto/miresto-mismatch.webp">
      <img src="/assets/miresto/miresto-mismatch.png" width="220" height="220" alt="計算が合わない…" loading="eager" decoding="async">
    </picture>
    <h1>ページが見つかりません</h1>
    <p>計算が合わない…。<br>URLが変わったか、削除された可能性があります。</p>
    <a class="button" href="/">トップへ戻る</a>
  </main>
</body>
</html>
